<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="site-header">
        <h1>Formularios Web</h1>
        <nav class="main-nav" aria-label="Navegación principal">
            <a class="active" href="/index.html">Login</a>
            <a href="/html/registro.html">Registro</a>
            <a href="/html/hoja-vida.html">Hoja de Vida</a>
            <a href="/html/encuesta.html">Encuesta</a>
        </nav>
    </header>

    <main class="page-container">
        <section class="card login-card">
            <div class="card-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tu correo electrónico y contraseña.</p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="usuario@dominio.com"
                        autocomplete="email"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >
                        <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            Mostrar
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <div id="loginWelcome" class="success-card hidden" aria-live="polite">
                <h3>¡Bienvenido!</h3>
                <p>Has iniciado sesión con éxito.</p>
                <p>Correo: <strong id="userEmailDisplay"></strong></p>
            </div>
        </section>
    </main>

    <script src="js/login.js"></script>
</body>
</html>
